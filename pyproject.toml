[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "garmin-connect-prom-exporter"
description = "Collect daily metrics from Garmin Connect and push them to Prometheus"
version = "0.0.1"
dependencies = [
    # CVE-2026-111943: 2026.10.19 drops the distrusted eMudhra emSign roots.
    "certifi >=2026.10.19",
    "garth ==0.6.3",
    "prometheus-client >= 0.19.0",
]

[project.optional-dependencies]
dev = [
    "pylint"
]

[project.urls]
Home = "https://github.com/astromechza/garmin-connect-prom-exporter"
